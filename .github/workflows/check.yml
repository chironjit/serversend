name: Check

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            apps/desktop/go.sum
            apps/server/go.sum
            shared/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            apps/desktop/frontend/package-lock.json
            apps/server/admin/package-lock.json
      - name: Linux native build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libwayland-dev
      - name: Windows CGO compiler
        if: runner.os == 'Windows'
        run: echo 'C:/msys64/mingw64/bin' >> "$GITHUB_PATH"
      - name: Restore pinned frontend dependencies
        working-directory: apps/desktop/frontend
        run: npm ci
      - name: Restore pinned admin dependencies
        working-directory: apps/server/admin
        run: npm ci
      - name: Restore Go dependencies
        run: |
          (cd shared && GOWORK=off go mod download)
          (cd apps/server && GOWORK=off go mod download)
          (cd apps/desktop && go mod download)
      - name: Install matching Wails CLI
        run: GOWORK=off go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
      - name: Workspace, frontend tests, and native desktop build
        run: make check-layout check-desktop check-bindings
      - name: Linux server, shared code, and real scaffold smoke
        if: runner.os == 'Linux'
        run: make check-shared check-server check-smoke
      - name: Windows and macOS admin shell
        if: runner.os != 'Linux'
        run: make check-admin
      - name: Native CGO persistence builds and recovery tests
        run: make check-persistence
      - name: Linux persistence and server race checks
        if: runner.os == 'Linux'
        run: |
          (cd shared && GOWORK=off GOPROXY=off GOSUMDB=off go test -mod=readonly -race ./...)
          (cd apps/server && GOWORK=off GOPROXY=off GOSUMDB=off go test -mod=readonly -race ./...)
      - name: Verify checks did not change tracked files
        run: git diff --exit-code
