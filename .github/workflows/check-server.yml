name: Check server

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: check-server-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            apps/server/go.sum
            shared/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: apps/server/admin/package-lock.json
      - name: Restore admin dependencies
        working-directory: apps/server/admin
        run: npm ci
      - name: Restore Go dependencies
        run: |
          (cd shared && go mod download)
          (cd apps/server && go mod download)
      - name: Shared and server checks
        run: make check-release check-shared check-server
      - name: Native shared and server persistence
        run: bash shared/scripts/check_persistence.sh shared apps/server
      - name: Race checks
        run: |
          (cd shared && GOPROXY=off GOSUMDB=off go test -mod=readonly -race ./...)
          (cd apps/server && GOPROXY=off GOSUMDB=off go test -mod=readonly -race ./...)
      - name: Verify checks did not change tracked files
        run: git diff --exit-code
