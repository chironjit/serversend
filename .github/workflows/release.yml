name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Validate version and create draft release
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node scripts/release.mjs --validate-tag "$RELEASE_TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          releases=$(gh release list --limit 100 --json tagName,isDraft)
          state=$(RELEASES="$releases" node --input-type=module -e '
            const release = JSON.parse(process.env.RELEASES).find(r => r.tagName === process.env.RELEASE_TAG);
            console.log(release ? (release.isDraft ? "draft" : "published") : "missing");')
          case "$state" in
            published) echo 'This release is already published; use a new version.' >&2; exit 1 ;;
            missing) gh release create "$RELEASE_TAG" --verify-tag --draft --title "ServerSend $version" --generate-notes ;;
          esac

  check:
    needs: prepare
    uses: ./.github/workflows/check.yml

  desktop:
    needs: [prepare, check]
    name: Package desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      CGO_ENABLED: '1'
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            apps/desktop/go.sum
            shared/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: apps/desktop/frontend/package-lock.json
      - name: Linux native build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libwayland-dev
      - name: Windows CGO compiler
        if: runner.os == 'Windows'
        run: echo 'C:/msys64/mingw64/bin' >> "$GITHUB_PATH"
      - name: Restore pinned dependencies
        run: |
          (cd apps/desktop/frontend && npm ci)
          (cd shared && go mod download)
          (cd apps/desktop && go mod download)
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
      - name: Build production frontend
        working-directory: apps/desktop/frontend
        run: npm run build
      - name: Package native desktop
        run: bash scripts/package-desktop.sh "$RELEASE_VERSION"
      - name: Verify packaging did not change tracked files
        run: git diff --exit-code
      - name: Upload desktop download to draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(gh release view "v$RELEASE_VERSION" --json isDraft --jq .isDraft)" = true
          gh release upload "v$RELEASE_VERSION" dist/* --clobber

  publish:
    needs: [prepare, check, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set image names
        shell: bash
        run: |
          echo "IMAGE=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "SERIES=${VERSION%.*}" >> "$GITHUB_ENV"
      - name: Sign in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Refuse replacing an exact image version
        shell: bash
        run: |
          set -euo pipefail
          error=$(mktemp)
          trap 'rm -f "$error"' EXIT
          if docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>"$error"; then
            echo 'Exact image version already exists; release a new version instead.' >&2
            exit 1
          fi
          if ! grep -Eq 'manifest unknown|no such manifest' "$error"; then
            cat "$error" >&2
            exit 1
          fi
      - name: Build linux/amd64 image
        run: |
          docker build --platform linux/amd64 \
            -f apps/server/deploy/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/$REPOSITORY" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE:$VERSION" -t "$IMAGE:$SERIES" -t "$IMAGE:latest" .
      - name: Check container TLS and persistence
        run: |
          bash apps/server/scripts/check_container.sh "$IMAGE:$VERSION" --private-ipv4
          bash apps/server/scripts/check_container.sh "$IMAGE:$VERSION" external
      - name: Publish version and update channels
        run: |
          # Exact versions are immutable: refuse to overwrite one pushed earlier.
          if docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "$IMAGE:$VERSION already exists; release a new version instead." >&2
            exit 1
          fi
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:$SERIES"
          docker push "$IMAGE:latest"
      - name: Sign out of GHCR
        if: always()
        run: docker logout ghcr.io
      - name: Publish GitHub Release with checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view "v$VERSION" --json isDraft --jq .isDraft)" = true
          mkdir -p dist
          gh release download "v$VERSION" --pattern 'serversend-desktop-*' --dir dist
          test "$(find dist -type f | wc -l)" -eq 3
          for payload in 'linux-*.AppImage' 'windows-*.zip' 'darwin-*.zip'; do
            compgen -G "dist/serversend-desktop-$VERSION-$payload" >/dev/null
          done
          (cd dist && sha256sum serversend-desktop-* > SHA256SUMS && sha256sum --check SHA256SUMS)
          gh release upload "v$VERSION" dist/SHA256SUMS --clobber
          gh release view "v$VERSION" --json body --jq .body > dist/notes.md
          cat >> dist/notes.md <<EOF

          Server image: \`$IMAGE:$VERSION\` (Linux amd64).
          Update channels: \`$IMAGE:$SERIES\`, \`$IMAGE:latest\`.

          Desktop downloads are native builds for the OS/architecture in each filename.
          Linux AppImages require Ubuntu 24.04 or compatible, GTK4, WebKitGTK 6.0 and FUSE 2 (or use --appimage-extract-and-run); Windows requires WebView2.
          Windows downloads are unsigned; macOS bundles are ad-hoc signed, without notarization.
          Desktop: use ServerSend → Check for Updates… and finish transfers before Restart & Apply.
          Downloads are checked against SHA256SUMS; release signatures are not configured.
          Server updates interrupt transfers. Schema upgrades first back up to SERVER_SEND_UPGRADE_BACKUP_DIR and refuse to migrate without it.
          EOF
          gh release edit "v$VERSION" --notes-file dist/notes.md --draft=false --latest
